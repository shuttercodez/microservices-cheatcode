# Application Configuration (equivalent to application.yml in Spring Boot / appsettings.json in .NET)
# Any value here can be overridden at runtime by Environment Variables injected from
# AWS Secrets Manager, Azure Key Vault, or HashiCorp Vault in Kubernetes.

app:
  name: "inventory-order-service"
  env: "development"
  port: 8080
  shutdown_timeout_seconds: 5

database:
  host: "localhost"
  port: 5432
  user: "appuser"
  password: "apppassword"
  name: "inventory_db"
  ssl_mode: "disable"

redis:
  addr: "localhost:6379"

rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
