version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory_db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ตัวจัดการ Database Migration / Changelog อัตโนมัติ
  migrate:
    image: migrate/migrate
    container_name: inventory_migrate
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://appuser:apppassword@postgres:5432/inventory_db?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: inventory_mq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP Port สำหรับ Go เชื่อมต่อ
      - "15672:15672" # Web UI สำหรับเข้าไปดู Queue (http://localhost:15672)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
