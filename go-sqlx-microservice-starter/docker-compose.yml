services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory_db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Automated database schema migration service
  migrate:
    image: migrate/migrate
    container_name: inventory_migrate
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://appuser:apppassword@postgres:5432/inventory_db?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: inventory_mq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management Web UI (http://localhost:15672)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inventory_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Microservice API Container (Port 8080)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: inventory_db
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_TTL_SECONDS: 300
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # React 19 + Next.js 15 Frontend Console (Port 3000)
  react-frontend:
    build:
      context: ../react-nextjs-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: inventory_react_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped

  # Vue 3 + Nuxt 3 Frontend Console (Port 3001)
  vue-frontend:
    build:
      context: ../vue-nuxtjs-frontend
      dockerfile: Dockerfile
    container_name: inventory_vue_frontend
    ports:
      - "3001:3001"
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
