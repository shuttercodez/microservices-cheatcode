[project]
name = "python-fastapi-microservice-starter"
version = "0.1.0"
description = "Inventory & Order Microservice built with FastAPI, SQLAlchemy 2.0 Async, Redis, and aio-pika (RabbitMQ)"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "redis>=5.1.0",
    "aio-pika>=9.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
